<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Semen Merah Putih — QR Scanner</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#222;
}
.header{
  background:#c8102e;
  color:#fff;
  padding:18px 16px;
  text-align:center;
  font-size:20px;
  font-weight:700;
}
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}
h2{margin-top:0}
#reader{
  width:100%;
  overflow:hidden;
  border-radius:12px;
  margin:16px 0;
}
button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:15px;
  font-size:16px;
  font-weight:700;
  background:#c8102e;
  color:#fff;
}
.status{
  margin-top:14px;
  padding:13px;
  border-radius:10px;
  background:#eee;
  line-height:1.45;
}
.success{
  background:#e8f7ed;
  color:#146c2e;
}
.error{
  background:#fdecec;
  color:#9b1c1c;
}
.small{
  color:#777;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="header">SEMEN MERAH PUTIH</div>

<div class="container">
  <div class="card">

    <h2>Scan QR Voucher</h2>

    <div class="small">
      Arahkan kamera ke QR voucher customer.
      Scanner hanya membaca kode voucher.
    </div>

    <div id="reader"></div>

    <button id="startButton" onclick="startScanner()">
      AKTIFKAN KAMERA
    </button>

    <div id="status" class="status">
      Kamera belum aktif.
    </div>

  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
let scanner = null;
let scanning = false;

function setStatus(message, type){
  const el = document.getElementById('status');
  el.className = 'status' + (type ? ' ' + type : '');
  el.textContent = message;
}

async function startScanner(){
  if(scanning) return;

  const button = document.getElementById('startButton');
  button.disabled = true;
  button.textContent = 'MEMBUKA KAMERA...';

  try{
    if(!window.isSecureContext){
      throw new Error(
        'Scanner membutuhkan HTTPS. Buka halaman scanner melalui HTTPS.'
      );
    }

    scanner = new Html5Qrcode('reader');

    const cameras = await Html5Qrcode.getCameras();

    if(!cameras || cameras.length === 0){
      throw new Error('Kamera tidak ditemukan pada perangkat ini.');
    }

    let cameraId = cameras[0].id;

    const rear = cameras.find(function(camera){
      const label = (camera.label || '').toLowerCase();
      return (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment')
      );
    });

    if(rear) cameraId = rear.id;

    scanning = true;

    await scanner.start(
      cameraId,
      {
        fps:10,
        qrbox:function(viewfinderWidth, viewfinderHeight){
          const size = Math.floor(
            Math.min(viewfinderWidth, viewfinderHeight) * 0.70
          );
          return {width:size,height:size};
        },
        aspectRatio:1
      },
      onScanSuccess,
      function(errorMessage){}
    );

    button.textContent = 'KAMERA AKTIF';
    setStatus(
      'Kamera aktif. Arahkan ke QR voucher.',
      ''
    );

  }catch(error){
    scanning = false;
    button.disabled = false;
    button.textContent = 'AKTIFKAN KAMERA';

    setStatus(
      error.message || 'Kamera tidak dapat digunakan.',
      'error'
    );
  }
}

async function onScanSuccess(decodedText){
  const code = String(decodedText || '').trim();

  if(!code) return;

  // QR kita memang hanya berisi voucher code.
  // Scanner tidak memproses customer/phone/store.
  if(!/^SMP-[A-Z0-9]+$/i.test(code)){
    setStatus(
      'QR terbaca, tetapi bukan QR voucher Semen Merah Putih.',
      'error'
    );
    return;
  }

  try{
    if(scanner && scanning){
      await scanner.stop();
      await scanner.clear();
    }
  }catch(e){}

  scanning = false;

  // Kembali ke halaman redeem dengan parameter voucher.
  // URL halaman redeem disimpan sebagai parameter "return".
  // Kirim HANYA voucher code ke halaman Web App yang membuka scanner.
  // Scanner tidak menerima atau mengirim nomor HP/customer.
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({
      type: 'SMP_VOUCHER_SCANNED',
      voucher: code
    }, '*');

    setStatus(
      'QR berhasil dibaca: ' + code + '. Mengirim kode ke Web App...',
      'success'
    );

    setTimeout(function(){
      try { window.close(); } catch(e) {}
    }, 500);
    return;
  }

  // Fallback jika scanner dibuka langsung tanpa Web App.
  setStatus(
    'QR berhasil dibaca: ' + code +
    '. Scanner dibuka langsung, jadi tidak ada Web App tujuan.',
    'success'
  );
}
</script>

</body>
</html>
